<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrucialNET</title>
    <meta
      name="description"
      content="Bespoke democratic radical tech that reintroduces you back into your workflow."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cedarville+Cursive&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff;
        --paper-deep: #f7f7f7;
        --ink: #000000;
        --ink-soft: #4a4a4a;
        --line: #000000;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: "Averia Serif Libre", Georgia, serif;
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        /* faint paper grain */
        background-image:
          radial-gradient(
            circle at 20% 30%,
            rgba(0, 0, 0, 0.035) 0,
            transparent 55%
          ),
          radial-gradient(
            circle at 85% 75%,
            rgba(0, 0, 0, 0.03) 0,
            transparent 50%
          );
      }
      .wrap {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1rem;
        padding: 2rem 1.5rem;
      }
      .lede {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .wordmark {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        letter-spacing: 0.02em;
        font-size: clamp(2.4rem, 7vw, 4.75rem);
        line-height: 1;
        color: var(--ink);
      }
      .wordmark .net {
        color: var(--ink);
      }
      .tagline {
        margin-top: 1.25rem;
        font-size: clamp(1.1rem, 2.8vw, 1.55rem);
        font-weight: 400;
        font-style: normal;
        color: var(--ink-soft);
        max-width: 40ch;
        line-height: 1.45;
      }
      .form {
        display: flex;
        width: 100%;
        max-width: 420px;
        border: 2px solid var(--line);
        border-radius: 2px;
        background: var(--paper-deep);
        overflow: hidden;
        transition: border-color 0.2s ease;
      }
      /* stacked, but pushed to start 33% across on larger screens */
      @media (min-width: 760px) {
        .wrap {
          align-items: flex-start;
          text-align: left;
          padding-left: 33%;
          padding-right: clamp(2rem, 6vw, 4.5rem);
        }
        .lede {
          align-items: flex-start;
        }
        .tagline {
          max-width: 22ch;
        }
      }
      .contact {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 420px;
      }
      @media (min-width: 760px) {
        .contact {
          align-items: flex-start;
        }
      }
      .form:focus-within {
        border-color: var(--ink);
      }
      .form input {
        flex: 1;
        border: none;
        background-color: var(--paper);
        background-image: radial-gradient(
          circle,
          rgba(0, 0, 0, 0.14) 0.6px,
          transparent 0.7px
        );
        background-size: 8px 8px;
        padding: 0.95rem 1.1rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.9rem;
        color: var(--ink);
        outline: none;
        min-width: 0;
      }
      .form input::placeholder {
        color: var(--ink-soft);
        opacity: 0.7;
      }
      .form button {
        border: none;
        background: var(--ink);
        color: var(--paper);
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 0.82rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0 1.4rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .form button:hover {
        background: #222;
      }
      .form button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .note {
        margin-top: 1rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.03em;
        color: var(--ink-soft);
        min-height: 1rem;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .note.show {
        opacity: 1;
      }
      footer {
        text-align: center;
        padding: 1.5rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        opacity: 0.65;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="lede">
        <h1 class="wordmark">Crucial<span class="net">NET</span></h1>
        <p class="tagline">
          Bespoke democratic radical tech that reintroduces you back into your
          workflow.
        </p>
      </div>

      <div class="contact">
        <div class="form" id="form">
          <input
            type="email"
            id="email"
            placeholder="you@company.com"
            aria-label="Your email address"
            autocomplete="email"
          />
          <button type="button" id="submit">Get in touch</button>
        </div>
        <p class="note" id="note" role="status" aria-live="polite"></p>
      </div>
    </main>

    <footer>© <span id="year"></span> CrucialNET, LLC</footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      const email = document.getElementById("email");
      const note = document.getElementById("note");
      function submit() {
        const v = email.value.trim();
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        if (!ok) {
          note.textContent = "Enter a valid email to continue.";
          note.classList.add("show");
          email.focus();
          return;
        }
        window.location.href =
          "mailto:hello@crucialnet.com?subject=Inquiry&body=" +
          encodeURIComponent("From: " + v);
        note.textContent = "Opening your mail app…";
        note.classList.add("show");
      }
      document.getElementById("submit").addEventListener("click", submit);
      email.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
      });
    </script>
  </body>
</html>
